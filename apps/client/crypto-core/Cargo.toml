[package]
name = "crypto-core"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
bincode = "1.3"
chacha20poly1305 = "0.10.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde"] }
getrandom = "0.4.2"
hkdf = "0.13.0"
hmac = "0.13.0"
ml-dsa = "0.1.1"
ml-kem = { version = "0.3.2", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
sha2 = "0.11.0"
thiserror = "2.0.18"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[dev-dependencies]
hex = "0.4.3"
